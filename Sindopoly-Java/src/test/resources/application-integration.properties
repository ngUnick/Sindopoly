# Container addresses are supplied by IntegrationInfrastructureIT at runtime.
# This profile must not fall back to developer Redis or MariaDB settings.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
spring.task.scheduling.enabled=false
sindopoly.web.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
