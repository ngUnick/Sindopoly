# Local development defaults only. Production must use the prod profile.
spring.datasource.url=${SINDOPOLY_DB_URL:jdbc:mariadb://localhost:3306/sindopoly}
spring.datasource.username=${SINDOPOLY_DB_USERNAME:sindopoly_dev}
spring.datasource.password=${SINDOPOLY_DB_PASSWORD:sindopoly_dev_only}

spring.data.redis.host=${SINDOPOLY_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SINDOPOLY_REDIS_PORT:6379}
spring.data.redis.password=${SINDOPOLY_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SINDOPOLY_REDIS_SSL_ENABLED:false}

server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
sindopoly.web.allowed-origins=${SINDOPOLY_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1}
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
