spring.application.name=Sindopoly-Java

# MariaDB configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/sindopoly
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=nick
spring.datasource.password=nick123

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

#Redis configuration
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.timeout=60000
spring.redis.database=0
spring.data.redis.repositories.enabled=true

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Choose randomness provider: secure | randomorg
dice.source=randomorg
