spring.profiles.default=dev

server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=${SINDOPOLY_SESSION_TIMEOUT:2h}

# Error details stay server-side; transport handlers expose deliberate client messages.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
sindopoly.game.turn-timeout-seconds=${SINDOPOLY_GAME_TURN_TIMEOUT_SECONDS:60}
sindopoly.game.terminal-retention-seconds=${SINDOPOLY_GAME_TERMINAL_RETENTION_SECONDS:300}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Validated legacy Sindopoly schema
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
