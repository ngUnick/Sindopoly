# defaults for local dev
spring.profiles.active=@activatedProperties@

# --- DataSource (MariaDB) ---
spring.datasource.url=jdbc:mariadb://mariadb:3306/sindopoly
spring.datasource.username=nick
spring.datasource.password=nick123

# --- Redis ---
spring.data.redis.host=${SPRING_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# Browser session identity. Production HTTPS deployments must set Secure=true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SINDOPOLY_SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=${SINDOPOLY_SESSION_TIMEOUT:2h}
sindopoly.web.allowed-origins=${SINDOPOLY_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
