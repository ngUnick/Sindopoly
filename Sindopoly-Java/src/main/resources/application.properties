spring.application.name=Sindopoly-Java

# Database URL
spring.datasource.url=jdbc:mariadb://localhost:3306/MariaDB

# Database credentials
spring.datasource.username=nick
spring.datasource.password=nick123

# Database driver class name
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA properties (optional, if you are using JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

#Redis configuration
spring.redis.host=127.0.0.1
spring.redis.port=6379


# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect