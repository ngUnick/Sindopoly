spring.application.name=Sindopoly-Java

# Database URL (update the hostname and database name as needed)
spring.datasource.url=jdbc:mariadb://localhost:3306/Sindopoly

# Database credentials
spring.datasource.username=root
spring.datasource.password=nick123

# Database driver class name
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA properties (optional, if you are using JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
