# Production has no credential or origin fallback. Missing variables fail startup.
spring.datasource.url=${SINDOPOLY_DB_URL}
spring.datasource.username=${SINDOPOLY_DB_USERNAME}
spring.datasource.password=${SINDOPOLY_DB_PASSWORD}

spring.data.redis.host=${SINDOPOLY_REDIS_HOST}
spring.data.redis.port=${SINDOPOLY_REDIS_PORT:6379}
spring.data.redis.password=${SINDOPOLY_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${SINDOPOLY_REDIS_SSL_ENABLED:true}

sindopoly.web.allowed-origins=${SINDOPOLY_ALLOWED_ORIGINS}
server.servlet.session.cookie.same-site=${SINDOPOLY_SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=true

# Trust forwarded headers only when a trusted proxy strips client-supplied values.
server.forward-headers-strategy=${SINDOPOLY_FORWARD_HEADERS_STRATEGY:NONE}
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO
springdoc.api-docs.enabled=${SINDOPOLY_OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${SINDOPOLY_OPENAPI_ENABLED:false}
