# DEVELOPMENT ONLY: this stack publishes infrastructure ports and uses replaceable local defaults.
services:

  mariadb:
    image: mariadb:10.11
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${SINDOPOLY_DEV_DB_ROOT_PASSWORD:-sindopoly_dev_root_only}
      MARIADB_DATABASE: ${SINDOPOLY_DEV_DB_NAME:-sindopoly}
      MARIADB_USER: ${SINDOPOLY_DEV_DB_USERNAME:-sindopoly_dev}
      MARIADB_PASSWORD: ${SINDOPOLY_DEV_DB_PASSWORD:-sindopoly_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$${MARIADB_USER}\" -p\"$${MARIADB_PASSWORD}\" --silent"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 30s
    ports:
      - "3306:3306"

  redis:
    image: redis:7.0-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  backend:
    build:
      context: ./Sindopoly-Java
      dockerfile: Dockerfile
    image: sindopoly-backend:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      # The repository Compose stack is explicitly a development deployment.
      SPRING_PROFILES_ACTIVE: dev
      SINDOPOLY_DB_URL: jdbc:mariadb://mariadb:3306/${SINDOPOLY_DEV_DB_NAME:-sindopoly}
      SINDOPOLY_DB_USERNAME: ${SINDOPOLY_DEV_DB_USERNAME:-sindopoly_dev}
      SINDOPOLY_DB_PASSWORD: ${SINDOPOLY_DEV_DB_PASSWORD:-sindopoly_dev_only}
      SINDOPOLY_REDIS_HOST: redis
      SINDOPOLY_REDIS_PORT: 6379
      SINDOPOLY_ALLOWED_ORIGINS: ${SINDOPOLY_DEV_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173}

    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./sindopoly-front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${SINDOPOLY_DEV_API_BASE_URL:-http://localhost:8080}
    image: sindopoly-frontend:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
